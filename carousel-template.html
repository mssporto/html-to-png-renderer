<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carousel Slide Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFEBE4;
    --ink: #201C1B;
    --muted: #6E6862;
    --accent: #3E5641;
    --accent-soft: #D3DED0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg);
  }

  /* This class is what the rendering service screenshots directly —
     keep it exactly the canvas's target width/height. */
  .fn-canvas {
    width: 1080px;
    height: 1350px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 96px 88px 72px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .rule {
    margin-top: 24px;
    height: 1px;
    background: var(--ink);
    opacity: 0.15;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-optical-sizing: auto;
    font-size: 76px;
    line-height: 1.04;
    letter-spacing: -0.01em;
    margin-top: 64px;
    max-width: 820px;
  }

  .body-copy {
    font-family: 'Public Sans', sans-serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.5;
    color: var(--muted);
    margin-top: 40px;
    max-width: 760px;
  }

  .footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .footer-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 26px;
  }

  /* Signature element: an oversized folio number, bleeding slightly off
     the right edge — the page-turn marker of a printed carousel, sized
     up because with a fixed page count, the number itself is the content. */
  .page-number {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 220px;
    line-height: 0.8;
    letter-spacing: -0.02em;
    color: var(--accent-soft);
    margin-right: -14px;
  }
</style>
</head>
<body>
  <div class="fn-canvas">
    <span class="eyebrow">Carousel</span>
    <div class="rule"></div>

    <h1 class="title">Carousel title goes here, wrapping across two lines</h1>

    <p class="body-copy">
      Carousel body copy goes here — a few sentences explaining the point
      of this slide, sized to stay easy to read on a phone screen.
    </p>

    <div class="footer">
      <span class="footer-label">Slide</span>
      <span class="page-number">01</span>
    </div>
  </div>
</body>
</html>
